<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radhey Krishna Bachhar | World Clock</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/favicon-180.png">
<meta name="theme-color" content="#212529">
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #000;
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    .site-header {
        background: #212529;
        color: #fff;
        padding: 14px 16px;
        text-align: center;
        flex-shrink: 0;
    }
    .site-header .brand {
        display: inline-block;
        text-decoration: none;
        color: #fff;
        font-family: Arial, sans-serif;
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 0.2px;
    }
    .site-header .brand:hover { text-decoration: underline; }
    .site-header .sub {
        font-size: 13px;
        color: #94a3b8;
        margin-top: 4px;
        font-family: Arial, sans-serif;
    }
    .clock-area {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
        width: 90%;
        max-width: 960px;
    }
    .clock {
        text-align: center;
        padding: 20px;
        border-radius: 15px;
        background: #111;
        box-shadow: 0 0 20px rgba(255,255,255,0.1);
    }
    .city {
        font-size: 24px;
        margin-bottom: 10px;
    }
    .time {
        font-size: 48px;
        font-weight: bold;
        font-variant-numeric: tabular-nums;
    }
    .date {
        font-size: 18px;
        margin-top: 5px;
        color: #94a3b8;
    }
    footer {
        background: #212529;
        color: #94a3b8;
        font-size: 12px;
        padding: 12px 0;
        text-align: center;
        font-family: Arial, sans-serif;
        flex-shrink: 0;
    }
    footer a { color: #94a3b8; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="site-header">
    <a class="brand" href="/">Radhey Krishna Bachhar</a>
    <div class="sub">IT Specialist &middot; World Clock</div>
</div>
<div class="clock-area">
<div class="grid">
    <div class="clock">
        <div class="city">Fiji</div>
        <div class="time" id="fiji"></div>
        <div class="date" id="fiji-date"></div>
    </div>

    <div class="clock">
        <div class="city">Papua New Guinea</div>
        <div class="time" id="png"></div>
        <div class="date" id="png-date"></div>
    </div>

    <div class="clock">
        <div class="city">Sydney</div>
        <div class="time" id="sydney"></div>
        <div class="date" id="sydney-date"></div>
    </div>

    <div class="clock">
        <div class="city">India (Bangalore)</div>
        <div class="time" id="india"></div>
        <div class="date" id="india-date"></div>
    </div>

    <div class="clock">
        <div class="city">Nepal</div>
        <div class="time" id="nepal"></div>
        <div class="date" id="nepal-date"></div>
    </div>

    <div class="clock">
        <div class="city">Santa Clara</div>
        <div class="time" id="santa"></div>
        <div class="date" id="santa-date"></div>
    </div>
</div>
</div>
<footer>
    &copy; <script>document.write(new Date().getFullYear())</script> Radhey Krishna Bachhar &middot;
    <a href="mailto:info@radheykrishna.com.np">info@radheykrishna.com.np</a> &middot;
    <a href="/">Back to site</a>
</footer>
<script>
function updateClock() {
    const optionsTime = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
    const optionsDate = { year: 'numeric', month: 'short', day: 'numeric' };

    function setTime(id, dateId, timezone) {
        const now = new Date();
        const time = now.toLocaleTimeString('en-US', { ...optionsTime, timeZone: timezone });
        const date = now.toLocaleDateString('en-US', { ...optionsDate, timeZone: timezone });
        document.getElementById(id).innerText = time;
        document.getElementById(dateId).innerText = date;
    }

    setTime('fiji', 'fiji-date', 'Pacific/Fiji');
    setTime('png', 'png-date', 'Pacific/Port_Moresby');
    setTime('nepal', 'nepal-date', 'Asia/Kathmandu');
    setTime('sydney', 'sydney-date', 'Australia/Sydney');
    setTime('india', 'india-date', 'Asia/Kolkata');
    setTime('santa', 'santa-date', 'America/Los_Angeles');
}

setInterval(updateClock, 1000);
updateClock();
</script>
</body>
</html>
