<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radhey Krishna Bachhar | Public IP Checker</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<meta name="theme-color" content="#212529">
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 0;
        padding: 0;
    }
    .site-header {
        background: #212529;
        color: #fff;
        padding: 14px 0;
        margin-bottom: 28px;
        text-align: center;
    }
    .site-header .brand {
        font-family: Arial, sans-serif;
        font-size: 18px;
        font-weight: bold;
        color: #fff;
        text-decoration: none;
        display: inline-block;
        letter-spacing: 0.2px;
    }
    .site-header .brand:hover { text-decoration: underline; }
    .site-header .sub {
        font-size: 13px;
        color: #94a3b8;
        margin-top: 4px;
        font-family: Arial, sans-serif;
    }
    .content {
        padding: 0 16px 60px 16px;
    }
    h2 {
        font-size: 22px;
        margin-bottom: 16px;
        color: #212529;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background: #212529;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-family: inherit;
    }
    button:hover { background: #343a40; }
    #result {
        margin-top: 20px;
        border: 1px solid #ddd;
        padding: 15px;
        border-radius: 5px;
        display: none;
    }
    table {
        width: 100%;
        border-collapse: collapse;
    }
    td {
        padding: 8px;
        border-bottom: 1px solid #eee;
        font-size: 14px;
    }
    td:first-child {
        font-weight: bold;
        width: 180px;
        color: #495057;
        font-size: 13px;
    }
    footer {
        background: #212529;
        color: #94a3b8;
        font-size: 12px;
        padding: 16px 0;
        margin-top: 0;
        text-align: center;
        font-family: Arial, sans-serif;
    }
    footer a { color: #94a3b8; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="site-header">
    <a class="brand" href="/">Radhey Krishna Bachhar</a>
    <div class="sub">IT Specialist &middot; Public IP Checker</div>
</div>
<div class="content">
    <h2>Public IP Information</h2>
    <button onclick="checkIP()">Check Public IP</button>
    <div id="result"></div>
</div>
<footer>
    &copy; <script>document.write(new Date().getFullYear())</script> Radhey Krishna Bachhar &middot;
    <a href="mailto:info@radheykrishna.com.np">info@radheykrishna.com.np</a> &middot;
    <a href="/">Back to site</a>
</footer>
<script>
    async function checkIP() {
        const result = document.getElementById('result');
        result.style.display = 'block';
        result.innerHTML = 'Loading...';
        try {
            const response = await fetch('https://ipapi.co/json/');
            const data = await response.json();
            result.innerHTML = `
                <table>
                    <tr><td>Public IP</td><td>${data.ip}</td></tr>
                    <tr><td>Country</td><td>${data.country_name}</td></tr>
                    <tr><td>Region</td><td>${data.region}</td></tr>
                    <tr><td>City</td><td>${data.city}</td></tr>
                    <tr><td>ISP</td><td>${data.org}</td></tr>
                    <tr><td>ASN</td><td>${data.asn}</td></tr>
                    <tr><td>Timezone</td><td>${data.timezone}</td></tr>
                    <tr><td>Latitude</td><td>${data.latitude}</td></tr>
                    <tr><td>Longitude</td><td>${data.longitude}</td></tr>
                </table>
            `;
        } catch (err) {
            result.innerHTML = 'Unable to retrieve IP information.';
        }
    }
</script>
</body>
</html>
